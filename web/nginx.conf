server {
    listen 80;

    # HTTP/1.1 to the API: under nginx's default 1.0, a POST without a body and without Content-Length is a 400 there.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    root /usr/share/nginx/html;
    index index.html;

    # The API, its OpenAPI document and the Scalar reference at /docs
    location ~ ^/(api|docs|openapi)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: deep links like /vendor must serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

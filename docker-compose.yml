# BKK Smart Market prototype — `docker compose up` then open http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartmarket"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./api
      # The Vendor Assistant answers from docs/rules, which lives outside the api build context.
      additional_contexts:
        rules: ./docs/rules
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SmartMarket: Host=db;Port=5432;Database=smartmarket;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
